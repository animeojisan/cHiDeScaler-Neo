[package]
name = "chidescaler-neo"
version = "0.99.1"
edition = "2024"
description = "AI Upscaler & Frame Interpolator for Windows"
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1.0.103"
ash = "0.38.0"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
env_logger = "0.11.11"
glow = "0.17.0"
half = "2.7.1"
log = "0.4.33"
naga = { version = "29.0.4", features = ["glsl-in", "spv-out"] }
ort = { version = "2.0.0-rc.12", features = ["directml", "cuda", "tensorrt", "load-dynamic", "half"] }
png = "0.18.1"
raw-window-handle = "0.6"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Registry", "Win32_UI_Magnification", "Win32_Security", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows-capture = { path = "vendor/windows-capture" }
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "none"
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
